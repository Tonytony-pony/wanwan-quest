<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f8c3dd">
<meta name="robots" content="noindex">
<title>データの ふっかつ｜わんわんクエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff6fa5; --pink-deep:#c0417a; --pink-pale:#ffe3f0;
  --purple:#a76fe0; --purple-deep:#7a3fb8;
  --ink:#4a2340; --ink-soft:#8a5f7d; --line:#f0cfe2;
  --win:#fffafd; --shadow:#d38ab4; --gold:#ffcf3f; --gold-deep:#b07f00;
  --good:#2f8f4e; --good-deep:#1f6b35;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  margin:0;padding:16px 12px 70px;
  background:linear-gradient(170deg,#ffe7f3 0%,#f4e4ff 100%);
  background-attachment:fixed;color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  line-height:1.7;
}
.wrap{max-width:520px;margin:0 auto;}
h1{font-family:"DotGothic16",monospace;font-size:clamp(19px,5.2vw,26px);
  text-align:center;margin:0 0 4px;color:var(--pink-deep);text-shadow:2px 2px 0 #fff;}
.lead{text-align:center;font-size:12.5px;color:var(--ink-soft);margin:0 0 14px;}

.win{background:var(--win);border:3px solid var(--pink-deep);border-radius:16px;
  padding:13px 13px 15px;margin-bottom:15px;box-shadow:0 4px 0 var(--shadow);}
.win.purple{border-color:var(--purple-deep);box-shadow:0 4px 0 #9878c4;}
.win.gold{border-color:var(--gold-deep);box-shadow:0 4px 0 #8a6400;}
.win > h2{font-family:"DotGothic16",monospace;font-size:15px;color:var(--pink-deep);
  margin:0 0 3px;}
.win.purple > h2{color:var(--purple-deep);}
.win.gold > h2{color:var(--gold-deep);}
.win > p.sub{font-size:12px;color:var(--ink-soft);margin:0 0 10px;}

label.fl{display:block;font-size:12px;color:var(--ink-soft);margin:9px 0 3px;}
input[type=text],select{
  width:100%;font-family:inherit;font-size:15px;padding:8px 9px;color:var(--ink);
  border:2px solid var(--line);border-radius:10px;background:#fff;}
input[type=text]:focus,select:focus{outline:3px solid var(--purple);outline-offset:1px;}

/* いぬを えらぶ */
.dogs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;}
.dog{position:relative;border:3px solid var(--line);border-radius:13px;
  background:linear-gradient(180deg,#fff,#fdf3fb);padding:5px 4px 6px;
  text-align:center;cursor:pointer;user-select:none;}
.dog.on{border-color:var(--good);background:linear-gradient(180deg,#f2fcf5,#e3f6ea);
  box-shadow:0 3px 0 var(--good-deep);}
.dog img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:contain;}
.dog .nm{font-size:10.5px;line-height:1.3;color:var(--ink-soft);}
.dog.on .nm{color:var(--good-deep);font-weight:bold;}
.dog .tick{position:absolute;top:3px;right:5px;font-size:15px;color:var(--good);display:none;}
.dog.on .tick{display:block;}

/* えらんだ いぬの せってい */
.picked{margin-top:12px;}
.pcard{border:2px solid var(--line);border-radius:12px;padding:8px 9px 10px;
  margin-bottom:9px;background:linear-gradient(180deg,#fffdfe,#f8f0ff);}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:2px;}
.phead img{width:42px;height:42px;object-fit:contain;flex:none;}
.phead .pn{font-family:"DotGothic16",monospace;font-size:14px;color:var(--purple-deep);}
.prow{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.cur{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);
  margin-top:7px;}
.cur input{width:18px;height:18px;accent-color:var(--pink-deep);}

.quick{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;}
.quick button{font-family:inherit;font-size:12px;padding:3px 10px;cursor:pointer;
  color:var(--purple-deep);background:#f3e9ff;border:2px solid #d9c6ef;border-radius:999px;}
.quick button:active{transform:translateY(2px);}

.btn{display:block;width:100%;font-family:"DotGothic16",monospace;font-size:16px;
  color:#fff;padding:12px 8px;margin-top:10px;cursor:pointer;
  background:linear-gradient(180deg,#ff8dbb 0%,var(--pink) 55%,#ee5590 100%);
  border:3px solid var(--pink-deep);border-radius:13px;
  box-shadow:0 4px 0 var(--pink-deep);text-shadow:0 1px 0 rgba(150,30,80,.5);}
.btn.go{background:linear-gradient(180deg,#6fd694 0%,#3fae66 55%,#2b8e50 100%);
  border-color:var(--good-deep);box-shadow:0 4px 0 var(--good-deep);
  text-shadow:0 1px 0 rgba(20,80,40,.5);}
.btn.sub2{background:linear-gradient(180deg,#c79bec 0%,var(--purple) 55%,#8e56c9 100%);
  border-color:var(--purple-deep);box-shadow:0 4px 0 var(--purple-deep);font-size:14px;}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 currentColor;}
.btn[disabled]{filter:grayscale(.7);opacity:.6;}

textarea{width:100%;height:76px;font-size:11px;line-height:1.35;
  font-family:ui-monospace,Menlo,Consolas,monospace;padding:7px;
  border:2px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);
  resize:vertical;margin-top:8px;}

.now{font-size:12.5px;padding:8px 10px;border-radius:10px;
  background:#f1e7fb;border:2px solid #d9c6ef;color:var(--purple-deep);}
.now b{color:var(--good-deep);}
.now b.ng{color:var(--pink-deep);}

.msg{font-size:13px;margin-top:9px;min-height:1.4em;text-align:center;}
.msg.ok{color:var(--good-deep);font-weight:bold;}
.msg.ng{color:var(--pink-deep);font-weight:bold;}

/* たからもの の こすう */
.tgrp{margin-bottom:11px;}
.tgrp > h3{font-family:"DotGothic16",monospace;font-size:13px;color:var(--purple-deep);
  margin:0 0 4px;padding-bottom:3px;border-bottom:2px dotted var(--line);}
.trow{display:flex;align-items:center;gap:7px;padding:3px 0;}
.trow .em{font-size:19px;width:24px;text-align:center;flex:none;}
.trow .tn{flex:1;font-size:12.5px;line-height:1.35;}
.trow.on .tn{color:var(--good-deep);font-weight:bold;}
.stp{display:flex;align-items:center;gap:0;flex:none;}
.stp button{width:30px;height:30px;padding:0;cursor:pointer;
  font-family:"DotGothic16",monospace;font-size:16px;line-height:1;
  color:var(--purple-deep);background:#f3e9ff;border:2px solid #d9c6ef;}
.stp button.mi{border-radius:9px 0 0 9px;}
.stp button.pl{border-radius:0 9px 9px 0;}
.stp button:active{background:#e3d2f8;}
.stp .n{width:30px;text-align:center;font-family:"DotGothic16",monospace;
  font-size:14px;border-top:2px solid #d9c6ef;border-bottom:2px solid #d9c6ef;
  background:#fff;line-height:26px;height:30px;}
.trow.on .stp .n{color:var(--good-deep);background:#f2fcf5;}

.peek{font-size:12.5px;line-height:1.75;margin:0;}
.peek dt{float:left;clear:left;width:7.2em;color:var(--ink-soft);}
.peek dd{margin:0 0 0 7.4em;}
.foot{text-align:center;font-size:11.5px;color:var(--ink-soft);margin-top:22px;}
.foot a{color:var(--purple-deep);}
</style>
</head>
<body>
<div class="wrap">

  <h1>データの ふっかつ</h1>
  <p class="lead">きえて しまった きろくを、えらんで もどします。<br>
    おうちの人むけの ページです。</p>

  <div class="win purple">
    <h2>いまの データ</h2>
    <p class="sub">このタブレット（またはスマホ）に いま はいって いる ないよう</p>
    <div class="now" id="now">しらべて います…</div>
  </div>

  <div class="win">
    <h2>① そだてて いた いぬ</h2>
    <p class="sub">タップして えらぶ。なんびきでも えらべます</p>
    <div class="dogs" id="dogs"></div>
    <div class="picked" id="picked"></div>
  </div>

  <div class="win purple">
    <h2>② あそんで いた ようす</h2>

    <label class="fl">▼ きみの なまえ</label>
    <input type="text" id="player" maxlength="8" value="さくら" autocomplete="off">

    <label class="fl">▼ どこまで すすんで いた？</label>
    <select id="course">
      <option value="0">🌷 はじまりの にわ まで</option>
      <option value="1">🌳 ぼうけんの こうえん まで</option>
      <option value="2" selected>🍄 むずかしの もり まで</option>
      <option value="3">⛰ でんせつの やま まで</option>
    </select>

    <label class="fl">▼ なん日 つづけて おさんぽ していた？</label>
    <select id="streak"></select>

    <label class="fl">▼ ボールキャッチの さいこう きろく</label>
    <select id="catch"></select>
  </div>

  <div class="win">
    <h2>③ あつめて いた たからもの</h2>
    <p class="sub">1つずつ こすうを えらびます。わからない ものは 0 のままで OK</p>
    <div class="quick" style="margin:0 0 10px">
      <button type="button" id="t-zero">ぜんぶ 0</button>
      <button type="button" id="t-one">ぜんぶ 1こ</button>
      <button type="button" id="t-few">ざっくり うめる</button>
    </div>
    <div id="tlist"></div>
    <p class="sub" id="tsum" style="margin:10px 0 0"></p>
  </div>

  <div class="win gold">
    <h2>④ もどす</h2>
    <p class="sub">えらんだ ないようで じょうしょがきします</p>
    <div class="now" id="peekbox" style="background:#fff8e6;border-color:#e8d08a;color:#6b4c00">
      <dl class="peek" id="peek"></dl>
    </div>
    <button class="btn go" id="go">この ないようで もどす</button>
    <p class="msg" id="msg"></p>

    <button class="btn sub2" id="mkcode">バックアップコードを つくる（べつの 端末むけ）</button>
    <textarea id="code" readonly placeholder="べつの 端末に うつす ときは、ここに でる コードを アプリの「おうちの人へ」②に はりつけます"></textarea>
    <button class="btn sub2" id="copy">コピー</button>
  </div>

  <p class="foot">
    もどしたら <a href="index.html">わんわんクエストを ひらく</a><br>
    このページは ゲームには でてきません。
  </p>

</div>

<script>
(function(){
'use strict';

var SAVE_KEY = 'wanwanquest_save_v1';
var BK_KEY   = 'wanwanquest_backup_v1';
var BK_HEAD  = 'WQ1:';
var AFF_MAX  = 100;

var BREEDS = [
  { id:'beagle',        name:'ビーグル' },
  { id:'shiba',         name:'しばいぬ' },
  { id:'dachshund',     name:'ミニチュア<br>ダックス' },
  { id:'pomeranian',    name:'ポメラニアン' },
  { id:'chihuahua',     name:'チワワ' },
  { id:'frenchbulldog', name:'フレンチ<br>ブルドッグ' },
  { id:'bichon',        name:'ビション<br>フリーゼ' },
  { id:'golden',        name:'ゴールデン<br>レトリバー' },
  { id:'husky',         name:'ハスキー' },
  { id:'dalmatian',     name:'ダルメシアン' }
];
var COURSES = ['garden', 'park', 'forest', 'mountain'];

/* たからもの。アプリの TREASURES と おなじ ならび */
var TGROUP = [
  { c:'garden',   mark:'🌷', name:'はじまりの にわ', list:[
    ['flower','💮','しろい おはな'], ['ladybug','🐞','てんとうむし'],
    ['snail','🐌','かたつむり'],     ['butterfly','🦋','ちょうちょ'],
    ['berry','🍓','あまい いちご'],  ['clover','🍀','よつばの クローバー'] ] },
  { c:'park',     mark:'🌳', name:'ぼうけんの こうえん', list:[
    ['acorn','🌰','どんぐり'],       ['maple','🍁','もみじの は'],
    ['balloon','🎈','とんできた ふうせん'], ['ribbon','🎀','おちていた リボン'],
    ['kite','🪁','たこ'],            ['bell','🔔','きんいろの すず'] ] },
  { c:'forest',   mark:'🍄', name:'むずかしの もり', list:[
    ['mushroom','🍄','きのこ'],      ['herb','🌿','ふしぎな くさ'],
    ['squirrel','🐿️','もりの りす'], ['grape','🍇','やまぶどう'],
    ['candle','🕯️','ふるい ろうそく'], ['orb','🔮','ふしぎな 玉'] ] },
  { c:'mountain', mark:'⛰', name:'でんせつの やま', list:[
    ['cloud','☁️','ちぎれた くも'],  ['snow','❄️','とけない ゆき'],
    ['grass','🌾','やまの くさ'],    ['key','🗝️','ふるい かぎ'],
    ['drop','💧','わきみずの しずく'], ['gem','💎','ひかる ほうせき'] ] },
  { c:'any',      mark:'🌟', name:'どこでも まれに', list:[
    ['rainbow','🌈','にじの かけら'] ] }
];
/* れんぞく なん日で もらえる レアアイテム */
var RARES = [['star',3],['gift',5],['badge',7],['crown',10],
             ['bear',14],['shoot',21],['trophy',30]];
var NAMES = ['ポチ','モモ','ハナ','マロン','チョコ','さくら','ココ','ムギ'];

function $(id){ return document.getElementById(id); }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function dstr(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function addDays(d, n){ var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }

/* ------- えらんだ じょうたい ------- */
var picked = {};      /* id -> {name, level} */
var current = '';

/* ------- いぬを ならべる ------- */
(function(){
  var html = '', i, b;
  for(i = 0; i < BREEDS.length; i++){
    b = BREEDS[i];
    html += '<div class="dog" data-id="' + b.id + '">' +
              '<span class="tick">✔</span>' +
              '<img src="img/' + b.id + '_lv3.png" alt="" loading="lazy">' +
              '<div class="nm">' + b.name + '</div>' +
            '</div>';
  }
  $('dogs').innerHTML = html;
  $('dogs').addEventListener('click', function(e){
    var el = e.target.closest ? e.target.closest('.dog') : null;
    if(!el) return;
    var id = el.getAttribute('data-id');
    if(picked[id]){
      delete picked[id];
      el.classList.remove('on');
      if(current === id) current = '';
    }else{
      picked[id] = { name:'', level:5 };
      el.classList.add('on');
      if(!current) current = id;
    }
    drawPicked();
  });
})();

/* ------- えらんだ いぬの なまえと レベル ------- */
function drawPicked(){
  var ids = Object.keys(picked), html = '', i, id, b, j;
  if(!ids.length){
    $('picked').innerHTML = '<p class="sub" style="margin:10px 0 0">' +
      'まだ えらんで いません。うえから タップして ください。</p>';
    peek(); return;
  }
  for(i = 0; i < ids.length; i++){
    id = ids[i];
    b = null;
    for(j = 0; j < BREEDS.length; j++){ if(BREEDS[j].id === id) b = BREEDS[j]; }
    html += '<div class="pcard">' +
      '<div class="phead"><img src="img/' + id + '_lv3.png" alt="">' +
        '<span class="pn">' + b.name.replace('<br>', '') + '</span></div>' +
      '<div class="prow">' +
        '<div><label class="fl" style="margin-top:2px">▼ いぬの なまえ</label>' +
          '<input type="text" maxlength="8" class="jn" data-id="' + id + '" ' +
            'value="' + (picked[id].name || '') + '" placeholder="ポチ" autocomplete="off"></div>' +
        '<div><label class="fl" style="margin-top:2px">▼ レベル</label>' +
          '<select class="jl" data-id="' + id + '">' + lvOpts(picked[id].level) + '</select></div>' +
      '</div>' +
      '<div class="quick" data-for="' + id + '">' + nameBtns() + '</div>' +
      '<label class="cur"><input type="radio" name="cur" value="' + id + '"' +
        (current === id ? ' checked' : '') + '> いま そだてて いる いぬ</label>' +
    '</div>';
  }
  $('picked').innerHTML = html;
  peek();
}

function lvOpts(sel){
  var o = '', v;
  for(v = 1; v <= 30; v++){
    o += '<option value="' + v + '"' + (v === sel ? ' selected' : '') + '>レベル ' + v + '</option>';
  }
  return o;
}
function nameBtns(){
  var o = '', i;
  for(i = 0; i < NAMES.length; i++){
    o += '<button type="button" data-nm="' + NAMES[i] + '">' + NAMES[i] + '</button>';
  }
  return o;
}

$('picked').addEventListener('input', function(e){
  var t = e.target, id = t.getAttribute('data-id');
  if(!id || !picked[id]) return;
  if(t.classList.contains('jn')) picked[id].name = t.value;
  if(t.classList.contains('jl')) picked[id].level = parseInt(t.value, 10) || 1;
  peek();
});
$('picked').addEventListener('change', function(e){
  if(e.target.name === 'cur'){ current = e.target.value; peek(); }
});
$('picked').addEventListener('click', function(e){
  var nm = e.target.getAttribute && e.target.getAttribute('data-nm');
  if(!nm) return;
  var box = e.target.parentNode, id = box.getAttribute('data-for');
  if(!picked[id]) return;
  picked[id].name = nm;
  var inp = box.parentNode.querySelector('input.jn');
  if(inp) inp.value = nm;
  peek();
});

/* ------- えらびもの ------- */
(function(){
  var o = '', v;
  for(v = 0; v <= 40; v++){
    o += '<option value="' + v + '"' + (v === 7 ? ' selected' : '') + '>' +
         (v === 0 ? 'つづけて いなかった' : v + ' 日') + '</option>';
  }
  $('streak').innerHTML = o;
  o = '';
  for(v = 0; v <= 40; v++){
    o += '<option value="' + v + '"' + (v === 0 ? ' selected' : '') + '>' +
         (v === 0 ? 'あそんで いない' : v + ' こ') + '</option>';
  }
  $('catch').innerHTML = o;
})();

['player','course','streak','catch'].forEach(function(id){
  $(id).addEventListener('change', peek);
  $(id).addEventListener('input', peek);
});

/* ------- たからものの こすう ------- */
var tcount = {};      /* たからものの id -> こすう */

(function(){
  var html = '', g, i, t;
  for(g = 0; g < TGROUP.length; g++){
    html += '<div class="tgrp"><h3>' + TGROUP[g].mark + ' ' + TGROUP[g].name + '</h3>';
    for(i = 0; i < TGROUP[g].list.length; i++){
      t = TGROUP[g].list[i];
      tcount[t[0]] = 0;
      html += '<div class="trow" data-id="' + t[0] + '">' +
                '<span class="em">' + t[1] + '</span>' +
                '<span class="tn">' + t[2] + '</span>' +
                '<span class="stp">' +
                  '<button type="button" class="mi" data-d="-1" aria-label="へらす">−</button>' +
                  '<span class="n">0</span>' +
                  '<button type="button" class="pl" data-d="1" aria-label="ふやす">＋</button>' +
                '</span>' +
              '</div>';
    }
    html += '</div>';
  }
  $('tlist').innerHTML = html;
})();

function setCount(id, v){
  v = Math.max(0, Math.min(99, v));
  tcount[id] = v;
  var row = $('tlist').querySelector('.trow[data-id="' + id + '"]');
  if(row){
    row.querySelector('.n').textContent = v;
    row.classList.toggle('on', v > 0);
  }
}

$('tlist').addEventListener('click', function(e){
  var d = e.target.getAttribute && e.target.getAttribute('data-d');
  if(!d) return;
  var row = e.target.closest('.trow');
  if(!row) return;
  var id = row.getAttribute('data-id');
  setCount(id, (tcount[id] || 0) + parseInt(d, 10));
  tsum(); peek();
});

function fillAll(v){
  var k;
  for(k in tcount){ if(tcount.hasOwnProperty(k)) setCount(k, v); }
  tsum(); peek();
}
$('t-zero').addEventListener('click', function(){ fillAll(0); });
$('t-one').addEventListener('click',  function(){ fillAll(1); });

/* ひらいた コースぶん、それっぽく うめる（あとから 手で なおせる） */
$('t-few').addEventListener('click', function(){
  var ci = parseInt($('course').value, 10) || 0, g, i, t, k;
  for(k in tcount){ if(tcount.hasOwnProperty(k)) setCount(k, 0); }
  for(g = 0; g < TGROUP.length; g++){
    var gi = COURSES.indexOf(TGROUP[g].c);
    if(gi < 0 || gi > ci) continue;              /* まだ ひらいて いない コース */
    for(i = 0; i < TGROUP[g].list.length; i++){
      t = TGROUP[g].list[i];
      /* めずらしく ない ものほど おおく もって いる */
      setCount(t[0], i < 3 ? 3 - i + 1 : (i < 5 ? 1 : 0));
    }
  }
  tsum(); peek();
});

function tsum(){
  var kinds = 0, total = 0, k;
  for(k in tcount){
    if(!tcount.hasOwnProperty(k)) continue;
    if(tcount[k] > 0){ kinds++; total += tcount[k]; }
  }
  $('tsum').textContent = '25 しゅるいの うち ' + kinds + ' しゅるい／あわせて ' +
                          total + ' こ';
}
tsum();

/* ------- いまの データを みる ------- */
function readNow(){
  var raw = null;
  try{ raw = localStorage.getItem(SAVE_KEY); }catch(e){
    return '<b class="ng">ブラウザの ほぞんが つかえません</b>';
  }
  if(!raw) return '<b class="ng">データは ありません</b>（まっさらな じょうたい）';
  var d;
  try{ d = JSON.parse(raw); }catch(e){ return '<b class="ng">データが こわれて います</b>'; }
  var ids = (d && d.dogs) ? Object.keys(d.dogs) : [];
  if(!ids.length) return '<b class="ng">いぬは いません</b>（データは あるが からっぽ）';
  var s = 'なまえ：<b>' + (d.name || '（なし）') + '</b><br>いぬ：';
  var i, parts = [];
  for(i = 0; i < ids.length; i++){
    parts.push('<b>' + (d.dogs[ids[i]].dogName || '？') + '</b>（レベル ' +
               (d.dogs[ids[i]].level || 1) + '）');
  }
  return s + parts.join('、') + '<br>といた もんだい：<b>' + (d.totalOk || 0) + '</b> もん';
}
$('now').innerHTML = readNow();

/* ------- つくる ------- */
function buildSave(){
  var ids = Object.keys(picked), i, j, id;
  var today = new Date();
  var yst   = addDays(today, -1);            /* きのうまで おさんぽ した ことに する。
                                                きょう あそべば れんぞくが つづく */
  var s = {
    name:($('player').value || 'さくら').slice(0,8), current:'', dogs:{},
    cleared:{}, mistakes:{}, totalOk:0, totalNg:0,
    sound:true, bgm:true,
    catchBest:parseInt($('catch').value,10) || 0,
    rares:{}, months:{}, rest:0, rested:{},
    found:{}, zbonus:{}, days:{}, streak:0, best:0, lastDay:''
  };

  var top = 0;
  for(i = 0; i < ids.length; i++){
    id = ids[i];
    var lv = Math.max(1, Math.min(99, picked[id].level | 0));
    s.dogs[id] = {
      dogName:(picked[id].name || 'ポチ').slice(0,8),
      level:lv,
      affection:(lv >= 30 ? AFF_MAX : Math.round(AFF_MAX * 0.4))
    };
    top = Math.max(top, lv);
    /* あつめた ♥ が そのまま なつき度。レベル 1つで 100 */
    s.totalOk += (lv - 1) * AFF_MAX + s.dogs[id].affection;
  }
  s.current = current || ids[0] || '';
  s.totalNg = Math.round(s.totalOk * 0.09);

  /* すすんだ コース。ひとつ まえまで クリア ずみなら つぎが ひらく */
  var ci = parseInt($('course').value, 10) || 0;
  for(i = 0; i <= ci; i++) s.cleared[COURSES[i]] = true;

  /* たからもの。1つずつ えらんだ こすうを そのまま いれる */
  var k;
  for(k in tcount){
    if(tcount.hasOwnProperty(k) && tcount[k] > 0) s.found[k] = tcount[k];
  }
  /* コースの たからものを ぜんぶ あつめたら ずかん ボーナス */
  for(i = 0; i < TGROUP.length; i++){
    var gi = COURSES.indexOf(TGROUP[i].c);
    if(gi < 0) continue;
    var all = true;
    for(j = 0; j < TGROUP[i].list.length; j++){
      if(!(tcount[TGROUP[i].list[j][0]] > 0)){ all = false; break; }
    }
    if(all) s.zbonus[TGROUP[i].c] = true;
  }

  /* まいにち スタンプと れんぞく きろく */
  var st = parseInt($('streak').value, 10) || 0;
  s.streak = st;
  s.best   = st;
  if(st > 0){
    s.lastDay = dstr(yst);
    for(i = 0; i < st; i++) s.days[dstr(addDays(yst, -i))] = 1;
  }

  /* れんぞくで もらえる レアアイテム */
  for(i = 0; i < RARES.length; i++){
    if(st >= RARES[i][1]) s.rares[RARES[i][0]] = dstr(addDays(yst, -(st - RARES[i][1])));
  }

  /* こんげつの ごほうび（20日 あそんだら） */
  var cnt = {};
  for(k in s.days){
    if(s.days.hasOwnProperty(k)){
      var m = k.slice(0,7);
      cnt[m] = (cnt[m] || 0) + 1;
    }
  }
  for(k in cnt){ if(cnt[k] >= 20) s.months[k] = true; }

  /* おやすみけん（7日ごとに 1まい・3まいまで） */
  s.rest = Math.max(0, Math.min(3, Math.floor(st / 7)));

  return s;
}

/* ------- かくにん ひょうじ ------- */
function peek(){
  var ids = Object.keys(picked);
  var go = $('go');
  if(!ids.length){
    $('peek').innerHTML = '<dt>いぬ</dt><dd>まだ えらんで いません</dd>';
    go.disabled = true;
    return;
  }
  go.disabled = false;
  var s = buildSave(), i, parts = [];
  for(i = 0; i < ids.length; i++){
    parts.push(s.dogs[ids[i]].dogName + '（レベル ' + s.dogs[ids[i]].level + '）' +
               (ids[i] === s.current ? ' ★いま' : ''));
  }
  var nfound = 0, ntotal = 0, fk;
  for(fk in s.found){
    if(s.found.hasOwnProperty(fk)){ nfound++; ntotal += s.found[fk]; }
  }
  $('peek').innerHTML =
    '<dt>きみの なまえ</dt><dd>' + s.name + '</dd>' +
    '<dt>いぬ</dt><dd>' + parts.join('<br>') + '</dd>' +
    '<dt>といた もんだい</dt><dd>' + s.totalOk + ' もん</dd>' +
    '<dt>ひらいた コース</dt><dd>' + Object.keys(s.cleared).length + ' コース</dd>' +
    '<dt>たからもの</dt><dd>' + nfound + ' しゅるい／' + ntotal + ' こ</dd>' +
    '<dt>れんぞく きろく</dt><dd>' + s.streak + ' 日' +
      (s.streak ? '（きょう あそべば ' + (s.streak + 1) + ' 日め）' : '') + '</dd>' +
    '<dt>レアアイテム</dt><dd>' + Object.keys(s.rares).length + ' こ</dd>' +
    '<dt>おやすみけん</dt><dd>' + s.rest + ' まい</dd>';
}

function msg(t, kind){
  var e = $('msg');
  e.textContent = t || '';
  e.className = 'msg' + (kind ? ' ' + kind : '');
}

/* ------- もどす ------- */
$('go').addEventListener('click', function(){
  if(!Object.keys(picked).length){ msg('さきに いぬを えらんで ください。', 'ng'); return; }
  if(!window.confirm('いまの データは きえます。この ないようで もどしますか？')) return;
  var s = buildSave();
  try{
    /* まんいちの ため、いま はいって いる ものを ひかえに のこす */
    var old = localStorage.getItem(SAVE_KEY);
    if(old) localStorage.setItem(SAVE_KEY + '_old', old);
    localStorage.setItem(SAVE_KEY, JSON.stringify(s));
    /* じどうの ひかえにも いれて おく */
    var d = new Date();
    localStorage.setItem(BK_KEY, JSON.stringify([{ d:dstr(d), s:s }]));
  }catch(e){
    msg('ほぞん できません でした（ブラウザの せってい）。', 'ng');
    return;
  }
  $('now').innerHTML = readNow();
  msg('もどしました！ この したの「わんわんクエストを ひらく」から あそべます。', 'ok');
});

/* ------- コード ------- */
function b64enc(str){
  return btoa(unescape(encodeURIComponent(str))).replace(/=+$/, '');
}
$('mkcode').addEventListener('click', function(){
  if(!Object.keys(picked).length){ msg('さきに いぬを えらんで ください。', 'ng'); return; }
  $('code').value = BK_HEAD +
    b64enc(JSON.stringify({ v:1, ts:Date.now(), save:buildSave() }));
  msg('コードを つくりました。', 'ok');
});
$('copy').addEventListener('click', function(){
  var t = $('code');
  if(!t.value){ msg('さきに コードを つくって ください。', 'ng'); return; }
  t.removeAttribute('readonly');
  t.select(); t.setSelectionRange(0, 999999);
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  t.setAttribute('readonly', 'readonly');
  if(!ok && navigator.clipboard){
    navigator.clipboard.writeText(t.value).then(
      function(){ msg('コピーしました。', 'ok'); },
      function(){ msg('コピーできません でした。ながおしで えらんで ください。', 'ng'); });
    return;
  }
  msg(ok ? 'コピーしました。' : 'コピーできません でした。ながおしで えらんで ください。',
      ok ? 'ok' : 'ng');
});

drawPicked();
})();
</script>
